spring.application.name=backend

# ---------------------------------------------------------------------------
# Puerto: local 8080 | Render inyecta PORT automáticamente
# ---------------------------------------------------------------------------
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# Base de datos
# Por defecto H2 (local). En Render/Neon define SPRING_DATASOURCE_URL etc.
# ---------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:cointribedb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# JPA / Hibernate
# En producción con Postgres usa:
#   SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 Console (solo útil en local; en Postgres no aplica)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Evita fallos si el pool tarda en conectar a Neon (cold start)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
